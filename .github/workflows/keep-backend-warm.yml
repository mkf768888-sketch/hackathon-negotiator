name: Keep backend warm

# Render Free-тариф "усыпляет" бэкенд после ~15 минут простоя, первый запрос
# после этого выполняется 30-50+ секунд — именно поэтому список персонажей
# грузился медленно. Этот cron пингует /health каждые 10 минут, чтобы бэкенд
# не успевал заснуть перед показом жюри.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 60 https://hackathon-negotiator-backend.onrender.com/health || true
